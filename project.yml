name: MediaDler
options:
  bundleIdPrefix: com.changyow.mediadler
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Recent XcodeGen writes objectVersion = 77 (Xcode 16 format), which older
  # Xcode (15.x) refuses to open ("future Xcode project file format"). Lower it
  # to 55 so the project opens in Xcode 14/15/16. (XcodeGen #1578)
  postGenCommand: "sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 55;/' MediaDler.xcodeproj/project.pbxproj"

packages:
  MediaDlerCore:
    path: MediaDlerCore
  YoutubeDL:
    url: https://github.com/kewlbear/YoutubeDL-iOS
    from: "0.0.2"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "3923UH7ZW6"
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      # YoutubeDL-iOS/PythonKit crashes inside extractInfo on device when built
      # with Swift release optimization. Keep Release unoptimized until the
      # dependency can be upgraded or isolated.
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile

targets:
  MediaDler:
    type: application
    platform: iOS
    sources:
      - path: MediaDler
    info:
      path: MediaDler/Info.plist
      properties:
        CFBundleDisplayName: media-dler
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 儲存下載的影片到你的相簿。
        # Lets users share a local video/audio file INTO media-dler ("Copy to
        # media-dler" / Open With). The system copies the file into our
        # container and launches us with a file:// URL — this is how local-file
        # transcription gets its input without a Share Extension (which has a
        # ~120MB memory cap) or App Groups (unavailable on free signing).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio/Video
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audio
              - public.mpeg-4
              - public.mp3
              - com.apple.m4a-audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.changyow.mediadler
            CFBundleURLSchemes:
              - mediadler
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.changyow.mediadler
    dependencies:
      - package: MediaDlerCore
      - package: YoutubeDL
        product: YoutubeDL
      - target: MediaDlerShare

  MediaDlerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: media-dler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changyow.mediadler.share
    dependencies:
      - package: MediaDlerCore

schemes:
  MediaDler:
    build:
      targets:
        MediaDler: all
    run:
      config: Debug
