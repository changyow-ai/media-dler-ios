name: MediaDler
options:
  bundleIdPrefix: com.changyow.mediadler
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Recent XcodeGen writes objectVersion = 77 (Xcode 16 format), which older
  # Xcode (15.x) refuses to open ("future Xcode project file format"). Lower it
  # to 55 so the project opens in Xcode 14/15/16. (XcodeGen #1578)
  postGenCommand: "sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 55;/' MediaDler.xcodeproj/project.pbxproj"

packages:
  MediaDlerCore:
    path: MediaDlerCore
  YoutubeDL:
    url: https://github.com/kewlbear/YoutubeDL-iOS
    from: "0.0.2"
  # Simplified→Taiwan-traditional (s2twp) for the transcription pipeline.
  # OpenCCConverter is guarded by `#if canImport(OpenCC)`; this dependency
  # activates it. Phrase-level localisation beats character-level conversion.
  SwiftyOpenCC:
    url: https://github.com/ddddxxx/SwiftyOpenCC
    # v2.0.0-beta is the SPM-native release: it bundles the OpenCC dictionaries
    # as package resources (Bundle.module) so they ship in the app. The older
    # stable v1.0.1 expects the dicts in the main bundle and fails at runtime
    # under SPM. Pinned by revision because `from:` won't select a prerelease.
    revision: 1d8105a0f7199c90af722bff62728050c858e777

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "3923UH7ZW6"
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      # YoutubeDL-iOS/PythonKit crashes inside extractInfo on device when built
      # with Swift release optimization. Keep Release unoptimized until the
      # dependency can be upgraded or isolated.
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: singlefile

targets:
  MediaDler:
    type: application
    platform: iOS
    sources:
      - path: MediaDler
    info:
      path: MediaDler/Info.plist
      properties:
        CFBundleDisplayName: media-dler
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: 儲存下載的影片到你的相簿。
        # Lets users share a local video/audio file INTO media-dler ("Copy to
        # media-dler" / Open With). The system copies the file into our
        # container and launches us with a file:// URL — this is how local-file
        # transcription gets its input without a Share Extension (which has a
        # ~120MB memory cap) or App Groups (unavailable on free signing).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio/Video
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audio
              - public.mpeg-4
              - public.mp3
              - com.apple.m4a-audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.changyow.mediadler
            CFBundleURLSchemes:
              - mediadler
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.changyow.mediadler
    dependencies:
      - package: MediaDlerCore
      - package: YoutubeDL
        product: YoutubeDL
      - package: SwiftyOpenCC
        product: OpenCC
      - target: MediaDlerShare
      # On-device transcription engine (whisper.cpp). NOT in git — build it
      # with `make whisper` (scripts/build-whisper.sh), then UNCOMMENT BOTH lines
      # below and re-run `make project`. The engine code is guarded by
      # `#if canImport(whisper)`, so the app builds fine without it.
      # CoreML must be linked too: the xcframework is built with Core ML encoder
      # support whose objects reference MLModel/… but its module map doesn't link
      # CoreML (verified on simulator — link error without it; whisper falls back
      # to CPU at runtime when no .mlmodelc is present).
      # - framework: Vendor/whisper.cpp/build-apple/whisper.xcframework
      #   embed: false
      # - sdk: CoreML.framework

  MediaDlerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: media-dler
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changyow.mediadler.share
    dependencies:
      - package: MediaDlerCore

schemes:
  MediaDler:
    build:
      targets:
        MediaDler: all
    run:
      config: Debug
